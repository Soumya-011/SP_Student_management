<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Coaching Center Admin{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">Coaching Manager</div>
            <ul class="nav-links">
                <li><a href="/" class="{% if active_page == 'dashboard' %}active{% endif %}">Dashboard & Search</a></li>
                <li><a href="/students" class="{% if active_page == 'students' %}active{% endif %}">Students & Enrollments</a></li>
                <li><a href="/teachers" class="{% if active_page == 'teachers' %}active{% endif %}">Teachers & Schedules</a></li>
                <li><a href="/payments" class="{% if active_page == 'payments' %}active{% endif %}">Payments & Dues Ledger</a></li>
            </ul>
            <div class="sidebar-footer">
                <span>Admin: <strong>{{ admin.username }}</strong></span>
                <button class="btn btn-sm btn-danger" onclick="logoutAdmin()">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <div id="toast-container"></div>
    <script src="/static/js/api.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
