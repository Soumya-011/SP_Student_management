<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Coaching Manager</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div style="display:flex; align-items:center; gap:0.65rem; margin-bottom:1rem;">
                <span class="brand-mark">CM</span>
                <span style="font-weight:700; font-size:1.05rem; color:var(--text-primary);">Coaching Manager</span>
            </div>
            <h2 style="font-size:1.35rem; margin-bottom:0.35rem;">Administrator Sign In</h2>
            <p style="color:var(--text-muted); font-size:0.875rem; margin-bottom:1.5rem;">
                Enter your credentials to manage students, teacher schedules, and monthly fee ledgers.
            </p>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required autocomplete="username" placeholder="admin">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
                </div>
                <p id="login-error" style="color:var(--danger); font-size:0.84rem; margin-bottom:0.75rem; display:none;"></p>
                <button type="submit" class="btn" style="width:100%; padding:0.65rem; margin-top:0.25rem;">Sign In to Portal</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const errEl = document.getElementById("login-error");
            errEl.style.display = "none";

            const formData = new URLSearchParams();
            formData.append("username", document.getElementById("username").value.trim());
            formData.append("password", document.getElementById("password").value);

            try {
                const res = await fetch("/api/v1/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: formData
                });
                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.detail || "Login failed");
                }
                window.location.href = "/";
            } catch (err) {
                errEl.textContent = err.message;
                errEl.style.display = "block";
            }
        });
    </script>
</body>
</html>
